name: "Generic ARM Resources"
label: "{{ LABELS.ArmResource }}"
table_name: "resources"
resource_type: "!microsoft.resources/resourcegroups"
properties:
  - "/id"
  - "/identity"
  - "/kind"
  - "/location"
  - "/managedBy"
  - "/name"
  - "/type"
  - "/tags"
column_mappings:
  rg_id: "_rg_id"
cypher: |
    UNWIND $batch AS row
    MERGE (obj:{{ LABELS.ArmResource }} {id: row.id})
    SET obj += {
        id : row.id,
        kind : row.kind,
        location : row.location,
        name : row.name,
        type : row.type,
        tags : [key in keys(row.tags) | key + ":" + row.tags[key]]
    }
    MERGE (rg:{{ LABELS.ArmResource }} {id: row._rg_id})
    SET rg:{{ LABELS.ResourceGroup }}
    MERGE (rg)-[:{{ REL.HAS_RESOURCE}}]->(obj)


    WITH obj, row
    CALL {
        WITH obj, row
        WITH obj, row WHERE row.managedBy IS NOT NULL 
        MERGE (h:{{ LABELS.ArmResource }} {id: row.managedBy})
        MERGE (h)-[:{{ REL.MANAGES }}]->(obj)
        RETURN count(*) AS _
    }

    WITH obj, row
    CALL {
        WITH obj, row
        WITH obj, row WHERE row.identity IS NOT NULL AND toLower(row.identity.type) = 'systemassigned' AND row.identity.principalId IS NOT NULL
            MERGE (i:{{ LABELS.GraphObject }} {id: row.identity.principalId})
            MERGE (obj)-[:{{ REL.HAS_IDENTITY }}]->(i)
        RETURN count(*) AS _
    }

    WITH obj, row
    CALL {
        WITH obj, row
        WITH obj, row WHERE row.identity IS NOT NULL AND toLower(row.identity.type) = 'userassigned'
            UNWIND keys(row.identity.userAssignedIdentities) AS subKey
            WITH obj, subKey, row.identity.userAssignedIdentities[subKey] AS ident
                MERGE (i:{{ LABELS.UserAssignedIdentity }} {id: subKey})
                MERGE (obj)-[:{{ REL.HAS_IDENTITY }}]->(i)

                WITH obj, i, ident WHERE ident.clientId IS NOT NULL
                MERGE (o:{{ LABELS.GraphObject }} {appId: ident.clientId})
                MERGE (i)-[:{{ REL.REPRESENTED_BY }}]->(o)
        RETURN count(*) AS _
    }

    WITH obj, row
    CALL {
        WITH obj, row
        UNWIND coalesce(row.properties.privateEndpointConnections, []) AS conn
        MERGE (p:{{ LABELS.PrivateEndpointConnection }} {id: conn.id})
        SET p += {
            name: conn.name,
            type: conn.type,
            groupIds: conn.properties.groupIds
        }
        MERGE (obj)-[:{{ REL.HAS_PRIVATE_ENDPOINT }}]->(r:{{ LABELS.ArmResource }} {id: conn.properties.privateEndpoint.id})
        RETURN count(*) AS _
    }
    RETURN count(*) AS _