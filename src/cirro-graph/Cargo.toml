[package]
description = "Ingestion tool for cirro"
edition = "2024"
name = "cirro-graph"
repository = "https://github.com/bishopfox/cirro"
version = "0.3.3"

[dependencies]
clap = { version = "4.5.41", features = ["cargo", "derive"] }
colored = "3.0.0"
fern = { version = "0.7.1", features = ["chrono"] }
log = "0.4.27"
neo4rs = { version = "0.8.0", features = ["json"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["serde_derive"] }
serde_json = "1.0.140"
strum = "0.27.1"
strum_macros = "0.27.1"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["full"] }
uuid = { version = "1.17.0", features = ["v4"] }
