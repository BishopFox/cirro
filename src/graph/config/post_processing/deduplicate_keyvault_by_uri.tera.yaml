name: "Deduplicate Key Vault by URI"
label: "PostProcessingDeduplicateKeyVaultByUri"
priority: 1000
cypher: |
  CALL apoc.periodic.iterate(
    "
    MATCH (n:{{ LABELS.KeyVault }})
    WHERE n.vaultUri IS NOT NULL
    WITH toLower(n.vaultUri) AS lid, collect(n) AS ns
    WHERE size(ns) > 1
    RETURN lid, ns
    ",
    "
    WITH lid, ns
    WITH
        head(ns) AS keep,
        tail(ns) AS dups,
        lid
    UNWIND dups AS d
    CALL apoc.refactor.mergeNodes(
        [keep, d],
        {properties:'combine', mergeRels:true}
    )
    YIELD node
    // Ensure vaultUris are lowercase
    SET keep.vaultUri = lid
    RETURN 1
  ",
  {batchSize: 1000, parallel: false}
  )