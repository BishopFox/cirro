name: "Subscriptions"
label: "{{ LABELS.Subscription }}"
table_name: "subscriptions"
properties:
  - "/id"
  - "/displayName"
  - "/authorizationSource"
  - "/managedByTenants"
  - "/state"
  - "/subscriptionId"
cypher: |
    UNWIND $batch AS row
    MERGE (obj:{{ LABELS.ArmResource }} {id: toLower(row.id)})
    SET obj:{{ LABELS.Subscription }}
    SET obj += {
        displayName : row.displayName,
        authorizationSource : row.authorizationSource,
        state : row.state,
        subscriptionId : row.subscriptionId,
        tenantId : row.tenantId
    }

    CALL (obj, row) {
        UNWIND coalesce(row.managedByTenants, []) AS tenant
        MERGE (t:{{ LABELS.Tenant }} {id: toLower(tenant.tenantId)})
        MERGE (t)-[:{{ REL.MANAGES }}]->(obj)
    }
