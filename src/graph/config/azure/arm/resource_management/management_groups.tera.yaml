name: "Management Group"
label: "{{ LABELS.ManagementGroup }}"
table_name: "managementGroupEntities"
properties:
  - "/id"
  - "/properties"
  - "/type"
cypher: |
    UNWIND $batch AS row
    CALL (row) {
        WITH row WHERE toLower(row.type) = 'microsoft.management/managementgroups'
        MERGE (obj:{{ LABELS.ManagementGroup }} {id: toLower(row.id)})
        SET obj.displayName = row.properties.displayName

        // If parent is null -> Tenant
        CALL (obj, row) {
            WITH row, obj WHERE row.properties.parent.id IS NULL

            // Merge the tenant into existing tenant objects but avoid GraphOrg
            MERGE (t:{{ LABELS.Tenant }} {id: toLower("/tenants/" + row.properties.tenantId)})
            MERGE (t)-[:{{ REL.CONTAINS }}]->(obj)
        }

        // If parent not null -> parent group
        CALL (obj, row) {
            WITH row, obj WHERE row.properties.parent.id IS NOT NULL
            MERGE (p:{{ LABELS.ManagementGroup }} {id: toLower(row.properties.parent.id)})
            MERGE (p)-[:{{ REL.CONTAINS }}]->(obj)
        }
    }

    CALL (row) {
        WITH row WHERE toLower(row.type) = '/subscriptions'
        MERGE (s:{{ LABELS.ArmResource }} {id: toLower(row.id)})
        SET s:{{ LABELS.Subscription }}
        MERGE (mg:{{ LABELS.ManagementGroup }} {id: toLower(row.properties.parent.id)})
        MERGE (mg)-[:{{ REL.CONTAINS }}]->(s)
    }
