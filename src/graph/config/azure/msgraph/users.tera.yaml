name: "Graph Users"
label: "{{ LABELS.GraphUser }}"
table_name: "users"
properties:
  - "/@odata.type"
  - "/accountEnabled"
  - "/agentIdentityBlueprintId"
  - "/city"
  - "/companyName"
  - "/country"
  - "/creationType"
  - "/department"
  - "/displayName"
  - "/givenName"
  - "/id"
  - "/identityParentId"
  - "/identityParentType"
  - "/jobTitle"
  - "/lastPasswordChangeDateTime"
  - "/mail"
  - "/mailNickname"
  - "/manager"
  - "/memberOf"
  - "/mobilePhone"
  - "/officeLocation"
  - "/onPremisesDomainName"
  - "/onPremisesDistinguishedName"
  - "/onPremisesImmutableId"
  - "/onPremisesLastSyncDateTime"
  - "/onPremisesSyncEnabled"
  - "/onPremisesSamAccountName"
  - "/onPremisesSecurityIdentifier"
  - "/onPremisesUserPrincipalName"
  - "/passwordPolicies"
  - "/refreshTokensValidFromDateTime"
  - "/securityIdentifier"
  - "/state"
  - "/surname"
  - "/userPrincipalName"
  - "/userType"
index_properties:
  - "{{ LABELS.GraphUser }}:userPrincipalName"
cypher: |
  UNWIND $batch as row
  MERGE (obj:{{ LABELS.GraphObject }} {id: toLower(row.id)})
  SET obj:{{ LABELS.GraphUser }}
  SET obj += {
      odataType: lower(row["@odata.type"]),
      accountEnabled: row.accountEnabled,
      city: row.city,
      companyName: row.companyName,
      country: row.country,
      creationType: row.creationType,
      department: row.department,
      displayName: row.displayName,
      givenName: row.givenName,
      agentIdentityBlueprintId: row.agentIdentityBlueprintId,
      identityParentId: row.identityParentId,
      identityParentType: row.identityParentType,
      jobTitle: row.jobTitle,
      lastPasswordChangeDateTime: row.lastPasswordChangeDateTime,
      mail: row.mail,
      mailNickname: row.mailNickname,
      mobilePhone: row.mobilePhone,
      officeLocation: row.officeLocation,
      onPremisesDomainName: row.onPremisesDomainName,
      onPremisesDistinguishedName: row.onPremisesDistinguishedName,
      onPremisesImmutableId: row.onPremisesImmutableId,
      onPremisesLastSyncDateTime: row.onPremisesLastSyncDateTime,
      onPremisesSyncEnabled: row.onPremisesSyncEnabled,
      onPremisesSamAccountName: row.onPremisesSamAccountName,
      onPremisesSecurityIdentifier: row.onPremisesSecurityIdentifier,
      onPremisesUserPrincipalName: row.onPremisesUserPrincipalName,
      passwordPolicies: row.passwordPolicies,
      refreshTokensValidFromDateTime: row.refreshTokensValidFromDateTime,
      securityIdentifier: row.securityIdentifier,
      state: row.state,
      surname: row.surname,
      userPrincipalName: row.userPrincipalName,
      userType: row.userType
  }

  WITH obj, row

  CALL (obj, row) {
      UNWIND coalesce(row.memberOf, []) AS memberOf
      MERGE (m:{{ LABELS.GraphObject }} {id: toLower(memberOf)})
      MERGE (obj)-[:{{ REL.MEMBER_OF }}]->(m)
  }

  // If manager is present, create a relationship from manager to the user
  // Manager is a single value, not an array, so we don't need to unwind it
  CALL (obj, row) {
      WITH obj, row
      WHERE row.manager IS NOT NULL
      MERGE (m:{{ LABELS.GraphObject }} {id: toLower(row.manager)})
      MERGE (m)-[:{{ REL.MANAGES }}]->(obj)
  }
