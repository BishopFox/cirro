[package]
edition = "2024"
name = "cirro"
repository = "https://github.com/bishopfox/cirro"
version = "1.0.0"

[features]
azure = ["collector"]
collector = [
    "dep:async-trait",
    "dep:base64",
    "dep:chrono",
    "dep:dashmap",
    "dep:futures",
    "dep:jsonwebtoken",
    "dep:once_cell",
    "dep:pem",
    "dep:reqwest",
    "dep:rsa",
    "dep:sha1",
    "dep:which",
]
default = ["azure", "tailscale", "graph"]
graph = [
    "dep:neo4rs",
    "dep:rayon",
    "dep:rust-embed",
    "dep:serde_yaml",
    "dep:strum",
    "dep:strum_macros",
    "dep:tera",
    "dep:url",
]
tailscale = ["collector"]

[dependencies]
# Common dependencies (shared between collection and graph)
clap = { version = "4.5.54", features = ["cargo", "derive"] }
colored = "3.0.0"
fern = { version = "0.7.1", features = ["chrono"] }
log = "0.4.27"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["serde_derive"] }
serde_json = "1.0.140"
thiserror = "2.0.16"
tokio = { version = "1.46.1", features = ["full"] }
uuid = { version = "1.17.0", features = ["v4"] }

# Collection-specific dependencies (from cirro, optional)
async-trait = { version = "0.1.78", optional = true }
base64 = { version = "0.22.1", optional = true }
chrono = { version = "0.4.41", optional = true }
dashmap = { version = "5.5.3", optional = true }
futures = { version = "0.3.31", optional = true }
jsonwebtoken = { version = "10.3.0", features = ["use_pem"], optional = true }
once_cell = { version = "1.19.0", optional = true }
pem = { version = "3.0.5", optional = true }
reqwest = { version = "0.13.2", features = [
    "json",
    "query",
    "form",
    "gzip",
    "brotli",
], optional = true }
rsa = { version = "0.9.8", features = ["sha1", "sha2"], optional = true }
sha1 = { version = "0.10.6", optional = true }
which = { version = "8.0.0", optional = true }

# Graph-specific dependencies (from cirro-graph, optional)
neo4rs = { version = "0.8.0", features = ["json"], optional = true }
rayon = { version = "1.10", optional = true }
rust-embed = { version = "8.11.0", features = ["compression"], optional = true }
serde_yaml = { version = "0.9.34", optional = true }
strum = { version = "0.27.1", optional = true }
strum_macros = { version = "0.27.1", optional = true }
tera = { version = "1.20.1", optional = true }
url = { version = "2.5.7", optional = true }

[profile.dev]
debug = "line-tables-only"
opt-level = 0

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = 'abort'
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
