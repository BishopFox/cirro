[workspace]
members = ["src/cirro", "src/cirro-graph"]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/bishopfox/cirro"
version = "0.4.0"

[workspace.dependencies]
clap = { version = "4.5.54", features = ["cargo", "derive"] }
colored = "3.0.0"
fern = { version = "0.7.1", features = ["chrono"] }
log = "0.4.27"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["serde_derive"] }
serde_json = "1.0.140"
thiserror = "2.0.16"
tokio = { version = "1.46.1", features = ["full"] }
uuid = { version = "1.17.0", features = ["v4"] }

[profile.dev]
debug = "line-tables-only"
opt-level = 0

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = 'abort'
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
