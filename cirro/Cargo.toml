[package]
authors = ["Leron Gray <daddycocoaman@gmail.com>"]
description = "A CLI tool for graphing Azure and Entra ID data"
edition = "2024"
name = "cirro"
repository = "https://github.com/bishopfox/cirro"
version = "0.1.0"

[dependencies]
async-trait = "0.1.78"
base64 = "0.22.1"
chrono = "0.4.41"
clap = { version = "4.5.41", features = ["cargo", "derive"] }
colored = "3.0.0"
dashmap = "5.5.3"
fern = { version = "0.7.1", features = ["chrono"] }
futures = "0.3.31"
jsonwebtoken = { version = "9.3.1", features = ["use_pem"] }
log = "0.4.27"
once_cell = "1.19.0"
pem = "3.0.5"
reqwest = { version = "0.12.22", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
] }
rsa = { version = "0.9.8", features = ["sha1", "sha2"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = "1.0.219"
serde_json = "1.0.140"
sha1 = "0.10.6"
thiserror = "1.0.57"
tokio = { version = "1.46.1", features = ["full"] }
uuid = { version = "1.17.0", features = ["v4"] }
which = "8.0.0"
